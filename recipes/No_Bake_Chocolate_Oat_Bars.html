    <h1>No-Bake Chocolate Oat Bars</h1>
    <img src="https://www.allrecipes.com/thmb/5DgnMBY7ddkYAPHuHzY68PJD9QQ=/750x0/filters:no_upscale():max_bytes(150000):strip_icc():format(webp)/10602-no-bake-chocolate-oat-bars-ddmfs-4x3-954e524af60040c193f9aaaa666b33f5.jpg"
        alt="No-Bake Chocolate Oat Bars" loading="lazy" height="350" width="450">
    <p>Delicious no-bake oatmeal bars with a chocolaty peanut butter layer. </p>
    <p>Ingredients</p>
    <ul>
        <li>1 cup butter</li>

        <li>½ cup packed brown sugar</li>

        <li>1 teaspoon vanilla extract</li>

        <li>3 cups quick-cooking oats</li>

        <li>1 cup semisweet chocolate chips</li>

        <li>½ cup peanut butter</li>
    </ul>
